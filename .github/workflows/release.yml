# Builds, tests and publishes a release when a version tag (v1.2.3) is pushed.
# Signing through SignPath runs once the repository variable SIGNPATH_ORGANIZATION_ID is set;
# until then the release is published unsigned. SignPath requires a "Code signing policy" section in the README: add it then.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Check the tag matches the project version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content src/Dispatch.csproj
          $version = 'v' + ($project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1)
          if ($env:TAG -ne $version) { throw "Tag $env:TAG does not match the project version $version" }

      - name: Test
        run: dotnet test Dispatch.sln -c Release --nologo

      - name: Build
        run: dotnet publish src -c Release -o publish --nologo

      - name: Upload unsigned build
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: publish/Dispatch.exe
          archive: false
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $signed = Test-Path signed/Dispatch.exe
          Copy-Item ($(if ($signed) { 'signed/Dispatch.exe' } else { 'publish/Dispatch.exe' })) release/Dispatch.exe
          $hash = (Get-FileHash release/Dispatch.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Dispatch.exe" | Set-Content release/Dispatch.exe.sha256 -NoNewline
          $status = if ($signed) { 'Signed through SignPath (see Code signing policy in the README).' } else { 'Unsigned: Windows may warn before the first run (More info, Run anyway).' }
          @("Download ``Dispatch.exe`` and run it. Needs Windows 10 or 11, Steam and Bodycam.", '', $status, '', "SHA-256: ``$hash``") | Set-Content release/notes.md

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG release/Dispatch.exe release/Dispatch.exe.sha256 --title "Dispatch $env:TAG" --notes-file release/notes.md --generate-notes --verify-tag
